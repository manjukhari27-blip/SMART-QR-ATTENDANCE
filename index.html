<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart QR Attendance System</title>
    <!-- QR Scanner Library -->
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #eef2f3; margin: 0; padding: 20px; text-align: center; }
        .card { background: #fff; max-width: 450px; margin: 20px auto; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .btn-group { margin-bottom: 20px; }
        button { background: #007bff; color: white; border: none; padding: 12px 20px; font-size: 15px; border-radius: 6px; cursor: pointer; margin: 5px; font-weight: bold; }
        button:hover { background: #0056b3; }
        input { padding: 12px; width: 85%; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 6px; font-size: 15px; }
        .success { color: #28a745; font-weight: bold; font-size: 18px; margin-top: 15px; background: #e8f8ec; padding: 10px; border-radius: 6px; }
        .error { color: #dc3545; font-weight: bold; font-size: 18px; margin-top: 15px; background: #fde8e8; padding: 10px; border-radius: 6px; }
        #reader { width: 100%; margin-top: 15px; }
        #qr-box img { margin-top: 10px; border: 4px solid #007bff; border-radius: 8px; }
    </style>
</head>
<body>

<div class="card">
    <h2>Smart QR Attendance</h2>
    
    <!-- Mode Switcher -->
    <div class="btn-group">
        <button onclick="setMode('teacher')">Teacher Mode</button>
        <button onclick="setMode('student')">Student Mode</button>
    </div>

    <!-- TEACHER PANEL -->
    <div id="teacher-panel" style="display:none;">
        <h3>Teacher Mode</h3>
        <p id="teacher-status">GPS Fetching...</p>
        <div id="qr-box"></div>
        <p id="teacher-coords" style="font-size: 12px; color: #666; margin-top: 10px;"></p>
        <p style="font-size: 11px; color: #28a745;">⚡ QR Refreshes automatically every 15s</p>
    </div>

    <!-- STUDENT PANEL -->
    <div id="student-panel" style="display:none;">
        <h3>Student Mode</h3>
        <input type="text" id="student-name" placeholder="Apna Full Name Daalein" required>
        <div id="reader"></div>
        <p id="student-status"></p>
    </div>
</div>

<script>
    let teacherLat = null;
    let teacherLon = null;
    let qrInterval = null;
    let html5QrcodeScanner = null;

    const gpsOptions = {
        enableHighAccuracy: true,
        timeout: 10000,
        maximumAge: 0
    };

    function setMode(mode) {
        document.getElementById('teacher-panel').style.display = mode === 'teacher' ? 'block' : 'none';
        document.getElementById('student-panel').style.display = mode === 'student' ? 'block' : 'none';
        
        if (qrInterval) clearInterval(qrInterval);
        
        if (mode === 'teacher') {
            initTeacherGPS();
        } else if (mode === 'student') {
            initStudentScanner();
        }
    }

    // --- TEACHER LOGIC ---
    function initTeacherGPS() {
        document.getElementById('teacher-status').innerText = "Device GPS Lock Ho Raha Hai...";
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(pos => {
                teacherLat = pos.coords.latitude;
                teacherLon = pos.coords.longitude;
                
                document.getElementById('teacher-status').innerText = "Live Dynamic QR Ready!";
                document.getElementById('teacher-coords').innerText = `Locked Location: ${teacherLat.toFixed(5)}, ${teacherLon.toFixed(5)}`;
                
                generateDynamicQR();
                // Refresh QR code every 15 seconds
                qrInterval = setInterval(generateDynamicQR, 15000); 
            }, err => {
                document.getElementById('teacher-status').innerText = "GPS Error: " + err.message;
            }, gpsOptions);
        }
    }

    function generateDynamicQR() {
        // 15-second dynamic time token
        let timeToken = Math.floor(Date.now() / 15000); 
        let payload = JSON.stringify({
            token: timeToken,
            lat: teacherLat,
            lon: teacherLon
        });

        document.getElementById('qr-box').innerHTML = 
            `<img src="https://api.qrserver.com/v1/create-qr-code/?size=230x230&data=${encodeURIComponent(payload)}" />`;
    }

    // --- STUDENT LOGIC ---
    function initStudentScanner() {
        if (!html5QrcodeScanner) {
            html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: 220 });
            html5QrcodeScanner.render(onScanSuccess);
        }
    }

    function onScanSuccess(decodedText) {
        let studentName = document.getElementById('student-name').value.trim();
        if (!studentName) {
            alert("Pehle Apna Name Fill Karein!");
            return;
        }

        try {
            let data = JSON.parse(decodedText);
            verifyAndSubmit(data, studentName);
        } catch (e) {
            showStatus("Invalid QR Code!", "error");
        }
    }

    // Haversine Distance Formula (Meters)
    function getDistanceInMeters(lat1, lon1, lat2, lon2) {
        const R = 6371e3; 
        const dLat = (lat2 - lat1) * Math.PI / 180;
        const dLon = (lon2 - lon1) * Math.PI / 180;
        const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                  Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                  Math.sin(dLon/2) * Math.sin(dLon/2);
        return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
    }

    function verifyAndSubmit(qrData, studentName) {
        showStatus("Location Verification In Progress...", "");

        navigator.geolocation.getCurrentPosition(pos => {
            let sLat = pos.coords.latitude;
            let sLon = pos.coords.longitude;

            let distance = getDistanceInMeters(qrData.lat, qrData.lon, sLat, sLon);
            let currentTimeToken = Math.floor(Date.now() / 15000);

            // 1. Time Expiry Check (15-sec window check)
            if (Math.abs(currentTimeToken - qrData.token) > 2) {
                showStatus("QR Code Expire Ho Chuka Hai (Proxy Failed)!", "error");
                return;
            }

            // 2. Hybrid Distance Limit (Laptop PC support up to 15,000m error)
            let maxAllowedDistance = 15000; // Laptop IP GPS Offset Allowed

            if (distance <= maxAllowedDistance) {
                showStatus(`Success! Attendance Marked for ${studentName} (${Math.round(distance)}m away)`, "success");
            } else {
                showStatus(`Proxy Blocked! Aap Classroom se ${Math.round(distance)}m dur hain!`, "error");
            }

        }, err => {
            showStatus("GPS Error: " + err.message, "error");
        }, gpsOptions);
    }

    function showStatus(msg, type) {
        let el = document.getElementById('student-status');
        el.className = type;
        el.innerText = msg;
    }
</script>

</body>
</html>
